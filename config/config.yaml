# ---- Model Setting ----

model:
  base_model_name: "meta-llama/Llama-3.2-1B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_path: "data/train.jsonl"
  val_path: "data/val.jsonl"
  max_length: 512

training:
  output_dir: "checkpoints/"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  save_total_limit: 3
  fp16: true
  bf16: false
  report_to: "none"

evaluation:
  checkpoint_path: "checkpoints/checkpoint-123"
  test_path: "data/test.jsonl"
  max_new_tokens: 256